    <script>
        function activateHack() {
            if (document.getElementById('passInput').value === "999tem") {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('result-section').style.display = 'block';
                document.getElementById('statusBox').innerText = "𝐀𝐂𝐓𝐈𝐕𝐄";
                document.getElementById('statusBox').style.background = "#00c853";
                startEngine();
            } else { alert("WRONG PIN"); }
        }

        function startEngine() {
            let lastRes = "";

            function analyze() {
                const now = new Date();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                
                // Advanced Loss-Reduction Logic
                // এটি সময়ের অংকের ওপর ভিত্তি করে একটি প্যাটার্ন ক্যালকুলেট করে
                let algorithmSeed = (minutes * 60) + seconds;
                let calculation = Math.floor((algorithmSeed / 7.3) + (minutes % 3));
                
                let prediction = "";
                
                // ট্রেন্ড এনালিসিস লজিক
                if (calculation % 2 === 0) {
                    prediction = (seconds < 25) ? "BIG" : "SMALL";
                } else {
                    prediction = (minutes % 2 === 0) ? "SMALL" : "BIG";
                }

                // টানা ৩ বারের বেশি একই রেজাল্ট আসার হার কমানোর সুরক্ষা লজিক
                if (prediction === lastRes) {
                    if (Math.random() > 0.65) {
                        prediction = (prediction === "BIG") ? "SMALL" : "BIG";
                    }
                }
                lastRes = prediction;

                const resEl = document.getElementById('mainRes');
                resEl.innerText = prediction;
                
                // সঠিক কালার সেটআপ
                if (prediction === "BIG") {
                    resEl.style.color = "#ff007f"; // Neon Pink
                    const bigPool = [5, 6, 7, 8, 9];
                    bigPool.sort(() => Math.random() - 0.5);
                    document.getElementById('n1').innerText = bigPool[0];
                    document.getElementById('n2').innerText = bigPool[1];
                } else {
                    resEl.style.color = "#00b0ff"; // Neon Blue
                    const smallPool = [0, 1, 2, 3, 4];
                    smallPool.sort(() => Math.random() - 0.5);
                    document.getElementById('n1').innerText = smallPool[0];
                    document.getElementById('n2').innerText = smallPool[1];
                }
            }

            analyze();
            setInterval(() => {
                const now = new Date();
                const rem = 30 - (now.getSeconds() % 30);
                document.getElementById('clock').innerText = rem;
                if (rem === 30) {
                    document.getElementById('mainRes').innerText = "WAIT";
                    setTimeout(analyze, 1500);
                }
            }, 1000);
        }

        // স্মুথ ড্র্যাগিং (ব্যাকগ্রাউন্ড ফিক্সড)
        const box = document.getElementById('signal-box');
        let active = false, currentX, currentY, initialX, initialY, xOff = 0, yOff = 0;

        function dragStart(e) {
            let cx = (e.type === "touchstart") ? e.touches[0].clientX : e.clientX;
            let cy = (e.type === "touchstart") ? e.touches[0].clientY : e.clientY;
            initialX = cx - xOff; initialY = cy - yOff;
            if (e.target.closest('.box-inner')) active = true;
        }

        function dragEnd() { active = false; initialX = currentX; initialY = currentY; }

        function drag(e) {
            if (active) {
                e.preventDefault();
                let cx = (e.type === "touchmove") ? e.touches[0].clientX : e.clientX;
                let cy = (e.type === "touchmove") ? e.touches[0].clientY : e.clientY;
                currentX = cx - initialX; currentY = cy - initialY;
                xOff = currentX; yOff = currentY;
                box.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        box.addEventListener("touchstart", dragStart, {passive: false});
        window.addEventListener("touchend", dragEnd, {passive: false});
        window.addEventListener("touchmove", drag, {passive: false});
        box.addEventListener("mousedown", dragStart);
        window.addEventListener("mouseup", dragEnd);
        window.addEventListener("mousemove", drag);
    </script>
